<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- wifi fan: three arcs over a dot, centred on (256, 320) -->
  <g fill="none" stroke="url(#wave)" stroke-width="34" stroke-linecap="round">
    <!-- r=160 -->
    <path d="M 125 228 A 160 160 0 0 1 387 228"/>
    <!-- r=110 -->
    <path d="M 166 257 A 110 110 0 0 1 346 257"/>
    <!-- r=60 -->
    <path d="M 207 286 A 60 60 0 0 1 305 286"/>
  </g>
  <circle cx="256" cy="320" r="24" fill="#7dd3fc"/>
</svg>
